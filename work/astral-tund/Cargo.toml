[package]
name = "astral-tund"
version = "0.1.0"
edition = "2021"
publish = false

# build.rs 负责在 iOS/armv7 下直接编译 ring 需要的 ARM 汇编
# （绕开 ring 那个在本 target 上不可靠的 build script，见 build.rs 注释）
build = "build.rs"

# lib：把联机核心暴露成 C ABI，给原生 UI（Objective-C）用；
# 同时 CLI(bin) 也复用它。
#   staticlib = 给 ObjC 链接的 libastral_tund.a
#   rlib      = 给下面的 bin 用
[lib]
name = "astral_tund"
crate-type = ["staticlib", "rlib"]

[[bin]]
name = "astral-tund"
path = "src/main.rs"

[build-dependencies]
cc = "1"

# 用 vendored 副本覆盖两个上游问题（详见 work/ios6/README.md 的「坑」表）：
#  * libc：utun 的 6 个符号被 cfg(target_os="macos") 挡住，iOS 编不过
#  * ring：32 位 arm 的 ASM_TARGETS 缺 Apple 条目 + poly1305 的 neon2
#          汇编是 ELF 语法，导致 17 个 _ring_core_* 符号链接期 undefined
# 用 path 依赖还有个好处：不走 registry 指纹缓存，build script 一定会重跑。
[patch.crates-io]
libc = { path = "../vendor/libc-0.2.191" }
ring = { path = "../vendor/ring-0.17.14" }

[dependencies]
anyhow = "1"
libc = "0.2"
lazy_static = "1"
uuid = "1"
# EasyTier 内部全部用 tracing 打日志（连 peer、分配 IP、tun 就绪…）。
# 不装 subscriber 这些行会被直接丢弃，等于组网过程完全不可见。
# 注意：tracing 的版本线是 0.1.x，**没有 1.0**，写 "1" 会让 cargo 解析失败。
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = [
    "fmt",
    "std",
    "smallvec",
    "ansi",
] }
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "net",
    "io-util",
    "sync",
    "signal",
] }

# 直接依赖 EasyTier（与 AstralGame 用的是同一个 fork/分支），
# 刻意**不**依赖 rust_lib_astral_game：那个 crate 会拉进 flutter_rust_bridge，
# 而 FRB 在 Apple 上依赖 oslog（需要 os/log.h，iOS 10+），iOS 6 编不过。
easytier = { git = "https://github.com/ldoubil/EasyTier.git", branch = "main-astral", features = [
    "wireguard",
    "websocket",
    "quic",
    "tun",
    "smoltcp",
    "socks5",
    "kcp",
    "faketcp",
    "magic-dns",
    "zstd",
] }
easytier-core = { git = "https://github.com/ldoubil/EasyTier.git", branch = "main-astral" }
