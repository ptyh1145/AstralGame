name: build-ios6

# 璇存槑锛氭湰 workflow 浼氭妸銆屾瀯寤烘棩蹇?+ 鐘舵€?+ 浜х墿銆嶆彁浜ゅ洖浠撳簱鐨?ci-out/ 鐩綍銆?# 杩欐牱鍗充娇娌℃湁 API token锛堝彧鐢?deploy key 鎺ㄤ唬鐮侊級锛屼篃鑳介€氳繃
#   https://raw.githubusercontent.com/<owner>/AstralGame/main/ci-out/status.txt
#   https://raw.githubusercontent.com/<owner>/AstralGame/main/ci-out/build.log
# 鍏紑璇诲埌缁撴灉銆俢i-out/ 涓嶅湪涓嬮潰鐨?paths 杩囨护閲岋紝涓嶄細鑷垜瑙﹀彂銆?on:
  workflow_dispatch:
  push:
    paths:
      - "work/astral-tund/**"
      - "work/ios6/**"
      - "work/ios-ui/**"
      - "work/vendor/**"
      - "sdk/**"
      - ".github/workflows/build-ios6.yml"

permissions:
  contents: write

jobs:
  build:
    # macos-14 鍦ㄦ湰浠撳簱浼氳瑙ｆ瀽鎴愪笉鍙敤鐨?'macos-14-arm64-us-default'锛坖ob 鐩存帴琚?cancel锛夈€?    # 瀹炴祴鍙敤锛歮acos-15-intel / macos-15 / macos-latest銆傝繖閲岀敤鏄庣‘鐨?Intel 闀滃儚銆?    # 娉ㄦ剰锛氶暅鍍忚嚜甯︾殑 Xcode 鍙埌 15/16銆乮OS SDK 17/18锛堝叏 arm64-only锛夛紝
    # 鎵€浠?armv7 蹇呴』闈犱粨搴撻噷鐨?iOS 6.1 SDK銆?    runs-on: macos-15-intel
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Show runner toolchain
        run: |
          sw_vers
          xcodebuild -version || true
          rustc --version || true
          echo "--- 娉ㄦ剰锛歳unner 鐨?Xcode 涓嶆敮鎸?armv7/iOS6锛屼笅闈㈡崲鑷 SDK + nightly ---"

      - name: Install Rust nightly (Tier-3 target needs build-std)
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          rustup default nightly
          rustc --version

      # 渚濊禆鏍戝緢澶э紙EasyTier + build-std锛夛紝娌℃湁缂撳瓨姣忔瑕佸崄鍑犲垎閽熴€?      - name: Cache cargo & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: work/astral-tund
          cache-targets: "true"

      - name: Install ldid
        run: brew install ldid || true

      # prost-build / prost-wkt-types 鐨?build script 闇€瑕?protoc銆?      # 浠撳簱 README 鎸囧畾 23.3锛岃繖閲屽浐瀹氳鐗堟湰锛涘け璐ュ啀閫€鍥?brew銆?      - name: Install protoc 23.3
        run: |
          set -euo pipefail
          PROTOC_VER=23.3
          URL="https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VER}/protoc-${PROTOC_VER}-osx-x86_64.zip"
          if curl -fL --retry 3 -o /tmp/protoc.zip "$URL"; then
            mkdir -p "$HOME/protoc"
            unzip -q -o /tmp/protoc.zip -d "$HOME/protoc"
            echo "$HOME/protoc/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/protoc/bin:$PATH"
            echo "PROTOC=$HOME/protoc/bin/protoc" >> "$GITHUB_ENV"
            protoc --version
          else
            echo "鍥哄畾鐗堟湰涓嬭浇澶辫触锛岄€€鍥?brew"
            brew install protobuf
            protoc --version
          fi

      - name: Provide iOS SDK
        env:
          IOS6_SDK_URL: ${{ secrets.IOS6_SDK_URL }}
        run: |
          set -euo pipefail
          mkdir -p work/ios6/sdk
          # 浼樺厛 iOS 8.1锛歳ustc 1.102 鐨?std 鎸?iOS 10 鐨?API 闈㈢紪璇戯紝
          # 8.1 SDK 宸叉彁渚?__tlv_bootstrap / openat 绛夌鍙凤紝閾炬帴鏈€骞插噣銆?          # 6.1 SDK 浣滀负鍚庡锛堝彧鍋?iOS 6/7 鏃舵墠闇€瑕侊級銆?          for v in 8.1 6.1; do
            if [ -d "sdk/iPhoneOS$v.sdk" ]; then
              echo "澶嶅埗 sdk/iPhoneOS$v.sdk"
              cp -R "sdk/iPhoneOS$v.sdk" work/ios6/sdk/
            elif [ -f "sdk/iPhoneOS$v.sdk.tar.gz" ]; then
              echo "瑙ｅ帇 sdk/iPhoneOS$v.sdk.tar.gz"
              tar -xzf "sdk/iPhoneOS$v.sdk.tar.gz" -C work/ios6/sdk
            fi
          done
          if [ ! -d work/ios6/sdk/iPhoneOS8.1.sdk ] && [ ! -d work/ios6/sdk/iPhoneOS6.1.sdk ]; then
            if [ -n "${IOS6_SDK_URL:-}" ]; then
              curl -fL --retry 3 -o /tmp/ios6sdk.tar.gz "$IOS6_SDK_URL"
              tar -xzf /tmp/ios6sdk.tar.gz -C work/ios6/sdk
            else
              echo "::error::缂哄皯 iOS SDK锛坰dk/iPhoneOS8.1.sdk.tar.gz 鎴?6.1锛?
              exit 1
            fi
          fi
          ls work/ios6/sdk
          test -f work/ios6/sdk/iPhoneOS8.1.sdk/usr/lib/libSystem.tbd \
            || test -f work/ios6/sdk/iPhoneOS6.1.sdk/usr/lib/libSystem.tbd

      - name: Build (armv7 / iOS 6.0)
        run: |
          set -o pipefail
          chmod +x work/ios6/build-ci.sh
          REPO_ROOT="$PWD" CI=1 ./work/ios6/build-ci.sh 2>&1 | tee /tmp/build.log

      - name: Verify artifact
        if: always()
        run: |
          if [ -f dist/astral-tund ]; then
            file dist/astral-tund
            otool -l dist/astral-tund | grep -A4 -E 'LC_VERSION_MIN_IPHONEOS|LC_BUILD_VERSION' || true
            otool -L dist/astral-tund | head -20 || true
            lipo -info dist/astral-tund || true
          else
            echo "娌℃湁浜х墿"
          fi

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: astral-tund-ios6-armv7
          path: |
            dist/astral-tund
            dist/astral-tund.sha256
            dist/AstralGame.ipa
            dist/AstralGame.ipa.sha256
          if-no-files-found: warn

      # 鍏抽敭涓€姝ワ細鎶婄粨鏋滃啓鍥炰粨搴擄紝渚涙棤 token 鐨勮瀵熻€呰鍙?      - name: Publish results to ci-out/
        if: always()
        env:
          GH_TOKEN_PUSH: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          mkdir -p ci-out
          # 鎴柇瓒呴暱琛岋細ICE 涔嬬被浼氭妸鏁存潯 rustc 鍛戒护琛?dump 杩涙潵锛堝嚑鍗?KB/琛岋級
          if [ -f /tmp/build.log ]; then
            awk 'length($0)>600 { printf "%s ...[truncated %d chars]\n", substr($0,1,600), length($0)-600; next } { print }' \
              /tmp/build.log > ci-out/build.log
          else
            echo "(no build log captured)" > ci-out/build.log
          fi

          STATUS="unknown"
          if [ -f dist/astral-tund ]; then
            STATUS="success"
            gzip -9 -c dist/astral-tund > ci-out/astral-tund.gz
            shasum -a 256 dist/astral-tund | awk '{print $1}' > ci-out/astral-tund.sha256
            file dist/astral-tund > ci-out/artifact-info.txt 2>&1 || true
            ( otool -l dist/astral-tund | grep -A4 -E 'LC_VERSION_MIN_IPHONEOS|LC_BUILD_VERSION' >> ci-out/artifact-info.txt ) 2>&1 || true
          fi
          if [ "${CI_BUILD_FAILED:-0}" = "1" ] || [ ! -f dist/astral-tund ]; then
            STATUS="$([ -f dist/astral-tund ] && echo success || echo failure)"
          fi

          {
            echo "status=$STATUS"
            echo "commit=$GITHUB_SHA"
            echo "run=$GITHUB_RUN_ID"
            echo "run_url=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner_image=$ImageOS"
            echo "xcode=$(xcodebuild -version 2>/dev/null | head -1)"
            echo "rustc=$(rustc --version 2>/dev/null)"
          } > ci-out/status.txt

          git config user.name  "astral-ios6-ci"
          git config user.email "ci@localhost.local"
          git add -f ci-out
          git commit -m "ci: results for $GITHUB_SHA [skip ci]" || echo "no changes"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "push failed (non-fatal)"
