name: probe-runners

# 一次性探针：把候选的 macOS runner 标签各起一个 job，
# 看哪些在本仓库真正可用。用完即可删除。
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe-runners.yml"

jobs:
  probe:
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-13
          - macos-14
          - macos-15
          - macos-15-intel
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: whoami
        run: |
          echo "runner_label=${{ matrix.os }}"
          sw_vers || true
          uname -m || true
          xcodebuild -version || true
          xcrun --sdk iphoneos --show-sdk-version || true
